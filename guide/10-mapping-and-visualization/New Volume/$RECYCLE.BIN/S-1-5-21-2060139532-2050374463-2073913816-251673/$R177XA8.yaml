Deep_Learning:
  classify_objects_with_pretrained_dl_model.ipynb:
    title: Classify objects with a pretrained deep learning model
    description: Use a pretrained model to classify detected objects in imagery based on their type or category.
    category: Deep Learning
    tags: [Inference]
    language: Python
    runtime: standard
    inputs:
      - name: Imagery service item
        description: The imagery service item to classify.
        type: item (type:"Image Service")
        variable: IMAGE-ITEM-ID
      - name: Feature layer item
        description: The feature layer item containing objects to classify.
        type: item (type: Feature Service) (esriGeometryPoint or esriGeometryPolygon)
        variable: FEATURE-LAYER-ITEM-ID
      - name: Pretrained model item
        description: The pretrained model item to use for object classification.
        type: item (type: "Deep Learning Package")
        variable: MODEL-ITEM-ID
    is_enterprise_compatible: True
    is_agol_compatible: True
    deprecated: False
