Content_Management:
  clone_group_and_group_content.ipynb:
    title: Clone a group and its content
    description: Clone a group and its contents from one organization to another.
    category: Administration
    tags: []
    language: Python
    runtime: standard
    inputs:
      - name: Group
        description: The group in your organization to clone.
        type: group
        variable: GROUP-ID
      - name: Target organization
        description: The URL of the target organization.
        type: string
        variable: TARGET_ORG_URL
      - name: Username
        description: The username used to sign in to the target organization.
        type: string
        variable: TARGET_ORG_USERNAME
      - name: Folder
        description: The name of the folder in the target organization where the cloned content will be stored.
        type: string
        variable: FOLDER-NAME
    is_enterprise_compatible: True
    is_agol_compatible: True
    deprecated: False


